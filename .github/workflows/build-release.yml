name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - bundleRelease

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Found repository secret KEYSTORE_BASE64. Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret provided. Creating CI signing keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=CI Build, OU=Mobile, O=AIStudio, L=Default, S=Default, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Verify Release APK
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found Release APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "APK Size: $APK_SIZE bytes"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inprocess-proxy-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_info.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
