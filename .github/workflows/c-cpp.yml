name: C/C++ Native Library CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-native:
    name: Build C++ Native Proxy Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK (for JNI headers)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Configure CMake
        run: |
          mkdir -p build-native
          cd build-native
          cmake ../app/src/main/cpp \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=17

      - name: Build Native Library
        run: |
          cmake --build build-native --verbose
