name: Build CCX Go JNI Native Library & Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-go-jni-and-apk:
    name: Cross-Compile Go to JNI (libccx.so) & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐹 Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔧 Locate and Configure Android NDK
        id: ndk_setup
        run: |
          set -euo pipefail
          echo "Checking available NDK versions..."
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1 || echo "")
          if [ -z "$NDK_PATH" ] && [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          fi
          echo "Found Android NDK at: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: 🛠️ Clone CCX & Cross-Compile backend-go to Android JNI (.so)
        run: |
          set -euo pipefail
          echo "Cloning BenedictKing/ccx into runner..."
          git clone --depth 1 https://github.com/BenedictKing/ccx.git /tmp/ccx

          echo "Injecting Android JNI Bridge and build script..."
          cp app/src/main/go/jni_bridge.go /tmp/ccx/backend-go/
          cp app/src/main/go/build_android_so.sh /tmp/ccx/backend-go/

          cd /tmp/ccx/backend-go
          chmod +x build_android_so.sh
          export OUTPUT_JNI_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          bash build_android_so.sh

      - name: 🔍 Verify Compiled libccx.so Libraries
        run: |
          echo "Generated JNI shared libraries:"
          ls -la app/src/main/jniLibs/*/*.so

      - name: 📤 Upload Native JNI Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccx-jni-shared-libraries
          path: app/src/main/jniLibs/
          retention-days: 14

      - name: 🛡️ Prepare Android Signing & Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=CCX JNI Build, OU=Mobile, O=AI Studio, L=Cloud, S=Global, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          chmod +x ./gradlew

      - name: 🚀 Build Release APK with Embedded libccx.so
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 📦 Locate Built Release APK
        id: apk_locator
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: 📤 Upload Release APK with Go JNI
        uses: actions/upload-artifact@v4
        with:
          name: inprocess-proxy-with-ccx-go-release-apk
          path: ${{ steps.apk_locator.outputs.apk_path }}
          retention-days: 30
